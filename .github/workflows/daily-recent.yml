name: Collecte quotidienne (nouvelles vidéos)

# Un seul passage par jour : collecte, notification (une max par jour) et envoi
# de la file d'attente. Le cron GitHub prend souvent plusieurs heures de retard
# (constaté : environ 8 h à cette heure-là). 6h UTC = 7h à Paris l'hiver, 8h
# l'été : même à l'heure, pas de notification la nuit.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-recent
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install --quiet google-api-python-client google-auth requests

      - name: Collecter les dernières vidéos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 collect_recent.py

      - name: Committer videos_recent.json
        run: |
          git add videos_recent.json
          if git diff --cached --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "actu: nouvelles vidéos du jour"
          git pull --rebase
          git push

      # Après publication : attente du cache GitHub (5 min) puis envoi, pour
      # que l'app récupère bien la nouvelle liste quand on touche la notif.
      - name: Notifier si nouvelles vidéos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NOTIFY_DELAY: "300"
        run: python3 notify.py --send-pending pending_notification.json

      # Ajouts de contenu poussés hors créneau (voir notify.py) : envoyés
      # maintenant, puis la file vidée est committée.
      - name: Envoyer la file d'attente
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 notify.py --send-queued
          [ -e queued_notifications.json ] || git ls-files --error-unmatch queued_notifications.json >/dev/null 2>&1 || exit 0  # file vide : rien à committer
          git add -A queued_notifications.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "notif: file d'attente envoyée"
          git pull --rebase
          git push
